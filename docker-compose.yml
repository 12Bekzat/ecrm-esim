services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecrm
      POSTGRES_USER: ecrm
      POSTGRES_PASSWORD: ecrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecrm -d ecrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://ecrm:ecrm@postgres:5432/ecrm?sslmode=disable
      JWT_SECRET: local-development-secret-change-before-production
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      CORS_ORIGINS: http://localhost:5173
      AUTO_MIGRATE: "true"
      BOOTSTRAP_ADMIN_EMAIL: admin@ecrm.local
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!
      BOOTSTRAP_ADMIN_NAME: Administrator
      ZESIMO_BASE_URL: https://zesimo.com
      ZESIMO_API_KEY: ${ZESIMO_API_KEY:-}
      ZESIMO_KEY_NAME: ${ZESIMO_KEY_NAME:-my_key}
      ZESIMO_TIMEOUT: 30s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
